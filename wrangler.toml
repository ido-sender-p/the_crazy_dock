name = "wildock"
main = "src/index.tsx"
compatibility_date = "2026-08-01"

[observability]
enabled = true

# Static assets (public/images — Marina Piccola's photo) pulled out for now.
# Add back when ready to deal with it:
# [assets]
# directory = "./public"
# binding = "ASSETS"
# Real D1 database (login + submissions + everything built on top of it:
# search, messages, favorites, comments, profile), created 2026-10-05 with the
# CLOUDFLARE_D1 token and migrated from src/db/schema.sql. `wrangler dev` still
# uses its own local sqlite file, never this remote one. Every route touching
# c.env.DB no-ops or 404s gracefully without it (see currentUser() in lib/session.ts).
[[d1_databases]]
binding = "DB"
database_name = "wildock-db"
database_id = "8cf59c65-de32-46b7-9edd-26be4b65a7c5"

# Real bucket, auto-provisioned on the 2026-08-30 deploy.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "wildock-photos"

[vars]
SITE_URL = "https://wildock.com"
# Public address for takedown/credit requests, shown on /credits. Empty = the page says it is being set up.
CONTACT_EMAIL = ""

# Gives the Worker the id of its deployed version, which keys the edge cache so every deploy starts with fresh HTML.
[version_metadata]
binding = "CF_VERSION_METADATA"
