name = "wildock"
main = "src/index.tsx"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Static assets (public/images — Marina Piccola's photo) pulled out for now.
# Add back when ready to deal with it:
# [assets]
# directory = "./public"
# binding = "ASSETS"

# Local-only SQLite for now (login + submissions + everything built on top
# of it: search, messages, favorites, comments, profile). The
# CLOUDFLARE_WORKERS_ID token still can't create/reach a real D1 database
# (auth error), and Cloudflare now rejects a deploy outright if this binding
# points at an invalid database_id — so it's commented out for production
# rather than left broken. Every route touching c.env.DB already no-ops or
# 404s gracefully without it (see currentUser() in lib/session.ts). Restore
# this with a real database_id once D1 is provisioned.
# [[d1_databases]]
# binding = "DB"
# database_name = "wildock-db"
# database_id = "local-dev-placeholder"

# Real bucket, auto-provisioned on the 2026-08-30 deploy.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "wildock-photos"

[vars]
SITE_URL = "https://wildock.com"
